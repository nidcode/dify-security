# =============================================================================
# LiteLLM Proxy — LLM ゲートウェイ / 統制レイヤー
#   全エージェントの LLM 呼び出しをここに集約し、
#     - 仮想APIキー / チーム / 予算 / RPM・TPM 制限 / モデルアクセス制御
#     - MCP ゲートウェイ (どのキーがどの MCP サーバ/ツールに到達できるか)
#     - ガードレール
#   を一元的に効かせる。
#
#   ネットワーク方針 (セキュリティ):
#     - ホストの ${LITELLM_HOST:-172.17.0.1}:4000 (docker bridge gateway) にのみ公開。
#       ホスト内部からのみ到達でき LAN には晒さない。
#     - Dify 各インスタンスは共有 docker ネットワークではなく
#       host-gateway (host.docker.internal:4000) 経由で到達する
#       → Dify インスタンス間に共有 L3 平面が無く、相互到達不可
#
#   起動: docker compose -f compose.litellm.yaml --env-file .env -p aiop-litellm up -d
# =============================================================================

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: always
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Vertex AI 認証 (WIF): 個人 ADC 全体ではなく、専用SA(aiplatform.userのみ)への
      # Workload Identity Federation。credentials.json は秘密を含まない (external_account
      # 設定のみ)。keycloak-token.jwt は scripts/gateway-wif-refresh-token.sh が cron で
      # 定期更新する短命JWT。詳細: docs/gcp-wif-vertex.md
      - ./gateway/wif/credentials.json:/gcloud-wif/credentials.json:ro
      - ./gateway/wif/keycloak-token.jwt:/gcloud-wif/keycloak-token.jwt:ro
    ports:
      # docker bridge gateway (既定 172.17.0.1) にのみ公開。
      # Dify コンテナは host.docker.internal(=このIP) 経由で到達。LAN には露出しない。
      # Docker Desktop/WSL2 の場合は .env で LITELLM_HOST=127.0.0.1 でも可。
      - "${LITELLM_HOST:-172.17.0.1}:${LITELLM_PORT:-4000}:4000"
    environment:
      # 管理 / DB
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # 管理 UI ( http://localhost:4000/ui ) ログイン
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      # プロバイダ資格情報
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # --- Vertex AI (Gemini埋め込み) を Workload Identity Federation で利用 (APIキー/鍵不要) ---
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud-wif/credentials.json
      VERTEX_PROJECT: ${VERTEX_PROJECT}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      # Linux で host.docker.internal を解決可能に (Docker Desktop では不要だが無害)
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - litellm-internal
    healthcheck:
      test:
        - CMD-SHELL
        - 'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # LiteLLM の状態 (仮想キー/予算/チーム/MCP権限/スペンドログ) を保持する Postgres。
  # DB-backed 機能と管理 UI に必須。内部のみ (ポート非公開)。
  litellm-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    networks:
      - litellm-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  litellm-pgdata:

networks:
  # LiteLLM とその DB だけが載る内部網。外部・Dify からは到達しない。
  litellm-internal:

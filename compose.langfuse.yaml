# =============================================================================
# Langfuse v3 — 自己ホスト Observability / 監査 / ロギング基盤
#   web + worker + postgres + clickhouse + redis + minio
#
#   起動: docker compose -f compose.langfuse.yaml --env-file .env -p aiop-langfuse up -d
#   (Makefile の `make up` が順序込みで実行)
#
#   設計方針 (本番ハードニング):
#     - 外部公開は langfuse-web (3000) と minio S3 (9090) のみ
#     - postgres/clickhouse/redis は一切ポート公開しない (内部ネットワークのみ)
#     - サインアップ無効化 + ヘッドレス初期化で org/project/key を固定プロビジョン
#     - 製品テレメトリ無効化
#     - litellm / dify から到達できるよう bridge サービス(web)を external network "aiop" に接続
# =============================================================================

# ---- web と worker で共有する環境変数 (YAML アンカー) ----
x-langfuse-common: &langfuse-common
  # Postgres (トランザクション)
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/postgres
  # ClickHouse (トレース/observation/score の OLAP)
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # Redis (キュー/キャッシュ)
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
  REDIS_TLS_ENABLED: "false"
  # S3/MinIO — イベントアップロード (v3 で必須: 全イベントが一旦 S3 へ)
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  # S3/MinIO — メディアアップロード (マルチモーダル)。endpoint はブラウザ到達可能URL必須。
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_MINIO_PUBLIC_URL}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  # セキュリティ
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  LANGFUSE_LOG_LEVEL: info

services:
  # ---------------------------------------------------------------------------
  # Langfuse Web — UI + ingestion API。唯一の主要外部公開点。
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    restart: always
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    ports:
      - "${LANGFUSE_WEB_PORT:-3000}:3000"
    environment:
      <<: *langfuse-common
      NEXTAUTH_URL: ${LANGFUSE_WEB_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # --- ハードニング: 公開サインアップ無効化 ---
      AUTH_DISABLE_SIGNUP: "true"
      # --- ヘッドレス初期化 (空のインスタンスにのみ作用) ---
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    networks:
      - langfuse-internal
      - aiop
    healthcheck:
      # langfuse イメージは Node ベース。Node18+ のグローバル fetch を使う (wget/curl 非依存)
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Langfuse Worker — 非同期イベント処理 (S3 → ClickHouse)。外部公開なし。
  # ---------------------------------------------------------------------------
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: always
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    environment:
      <<: *langfuse-common
    networks:
      - langfuse-internal

  # ---------------------------------------------------------------------------
  # Postgres — 内部のみ (ポート非公開)
  # ---------------------------------------------------------------------------
  langfuse-postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # ClickHouse — 内部のみ (ポート非公開)
  # ---------------------------------------------------------------------------
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: always
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis — 内部のみ (ポート非公開)。パスワード必須化。
  # ---------------------------------------------------------------------------
  langfuse-redis:
    image: redis:7
    restart: always
    command: >
      redis-server
      --requirepass ${LANGFUSE_REDIS_AUTH}
      --maxmemory-policy noeviction
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_AUTH}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MinIO — S3 互換オブジェクトストア。S3 API のみ公開 (presigned URL のため)。
  # console(9001) は localhost のみ。起動時に "langfuse" バケットを作成。
  # ---------------------------------------------------------------------------
  langfuse-minio:
    image: minio/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
    ports:
      - "${LANGFUSE_MINIO_PORT:-9090}:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse-minio-data:/data
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  langfuse-pgdata:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:

networks:
  # 内部専用 (DB等)。外部からは到達不可。
  langfuse-internal:
  # 共有ネットワーク。litellm / dify がここで langfuse-web を名前解決する。
  aiop:
    name: aiop
    external: true

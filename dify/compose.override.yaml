# =============================================================================
# Dify 用 override — `make dify-new` が複製先に docker-compose.override.yaml として配置。
# Compose は同ディレクトリの docker-compose.yaml と自動マージする。
#
# セキュリティ方針 (推奨A: host-gateway 分離):
#   Dify のアプリ層を共有 docker ネットワークに載せない。
#   → 各 Dify インスタンスは完全に独立し、インスタンス間で相互到達できない
#     (別テナント環境への越境・DNS名前衝突による取り違えを構造的に排除)。
#   LiteLLM へは「ホスト経由」で到達する:
#     host.docker.internal:host-gateway を各サービスに解決させ、
#     Dify 管理画面の API Base = http://host.docker.internal:4000/v1 とする。
#     LiteLLM 側はホスト loopback (127.0.0.1:4000) にのみ公開。
# =============================================================================
services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # dify-new.sh は EXPOSE_PLUGIN_DEBUGGING_PORT を "127.0.0.1:" にして 5003 の固定/LAN 公開を
    # 避ける。しかし公式 compose は同じ変数を PLUGIN_REMOTE_INSTALL_PORT(整数の設定値) にも流用する
    # ため、api の設定バリデーションが "127.0.0.1:" を整数解釈できず起動不能になる。
    # remote plugin install はこの構成で未使用なので、整数に固定して両立させる。
    environment:
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
  api_websocket:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker_beat:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  plugin_daemon:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 起動タイミング問題の対策: web は api が healthy になってから起動させる。
  # (これがないと web が api/DB 準備前にリクエストを受け、初回アクセスで
  #  一時的に "Internal Server Error" になることがある)
  web:
    depends_on:
      api:
        condition: service_healthy

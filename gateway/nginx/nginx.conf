# front-nginx ベース設定。server ブロックは templates/*.template から
# 起動時 envsubst で /etc/nginx/conf.d/*.conf に生成される。
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" host=$host';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Dify はファイル/ナレッジで大きめの body を扱う。Dify 標準に合わせ余裕を持たせる。
    client_max_body_size 100m;

    # Keycloak はヘッダが大きい (トークン/クッキー) → バッファを拡張。
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    proxy_busy_buffers_size 32k;

    # WebSocket (Dify /socket.io/) 用の Upgrade マップ。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # docker 埋め込み DNS。upstream 名を「変数 + resolver」で遅延解決することで、
    # oauth2-proxy-<team> が front-nginx 起動後に登録されても (順序に依らず) 動く。
    # 解決不能時は起動失敗ではなく 502 になる (fail-closed)。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 全 location 共通のプロキシ挙動 (server/location で継承)。
    # X-Forwarded-Proto/Port は $fwd_proto / $fwd_port 経由にして、自前終端 (https 固定) と
    # 前段終端 (ALB 等の値を引き継ぐ) を切り替えられるようにする。実際の定義は
    # conf.d の 00-forwarded.conf (templates/ または gateway-render.sh の生成物)。
    # これにより Dify は secure cookie / 絶対 URL 生成を正しく行う。
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    # X-Forwarded-For も 00-forwarded.conf の $fwd_for で決める。自前終端 (最外エッジ) では
    # 実接続元 IP で上書きし (詐称すると Keycloak の監査ログ等を汚染できるため)、
    # 前段終端 (GATEWAY_TLS=none) では前段が付けたクライアント IP 連鎖を引き継ぐ。
    proxy_set_header X-Forwarded-For    $fwd_for;
    proxy_set_header X-Forwarded-Proto  $fwd_proto;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $fwd_port;
    # 認証済み ID ヘッダはクライアント送信値を信頼しない。既定で空にクリアし、SSO を課す
    # location / でのみ auth_request の結果から再設定する。これにより SSO を通さない機械系
    # エンドポイント (/v1 等) に X-Auth-* を注入されても Dify へは渡らない (本人詐称の防止)。
    proxy_set_header X-Auth-User        "";
    proxy_set_header X-Auth-Email       "";
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    include /etc/nginx/conf.d/*.conf;
}
